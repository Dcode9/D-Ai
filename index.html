    <script>
        // Filter non-actionable extension script errors.
        (function() {
            window.addEventListener('error', (event) => {
                const message = `${event?.message || ''} ${event?.error?.message || ''}`;
                if (message.includes('has already been defined')) {
                    event.preventDefault();
                }
            }, true);

            window.onerror = function(message) {
                if (String(message || '').includes('has already been defined')) {
                    return true;
                }
                return false;
            };
        })();
    </script>

    <!-- Critical CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <!-- Suppress custom element registration errors from browser extensions -->
    <script>
        // Run as early as possible to intercept extension custom element registrations
        (function() {
            const originalDefine = window.CustomElementRegistry && window.CustomElementRegistry.prototype.define;
            if (!originalDefine) return;

            function safeDefine(name, constructor, options) {
                try {
                    if (!customElements.get(name)) {
                        originalDefine.call(customElements, name, constructor, options);
                    }
                } catch (e) {
                    // Silently ignore custom element already defined errors
                    if (!e.message || !e.message.includes('already been defined')) {
                        console.warn('Custom element registration warning:', e.message || e);
                    }
                }
            }

            customElements.define = safeDefine;
            window.CustomElementRegistry.prototype.define = safeDefine;
        })();
    </script>

    <!-- Deferred Libraries -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">

    <style>
        :root {
            --dai-bg: #050505;
            --dai-surface: #0f0f0f;
            --dai-surface-2: #151515;
            --dai-border: rgba(255,255,255,0.12);
            --dai-border-soft: rgba(255,255,255,0.08);
            --dai-text: #f4f6f8;
            --dai-muted: #a8b0bb;
            --dai-soft: #d7dce3;
            --dai-accent: #38bdf8;
            --dai-accent-2: #f59e0b;
            --dai-good: #34d399;
            --dai-warn: #f43f5e;
            --keyboard-inset: 0px;
        }
        body{background:var(--dai-bg);color:#F0F0F0;font-family:'Inter',sans-serif;overflow:hidden}
        *::-webkit-scrollbar{width:7px;height:7px}*::-webkit-scrollbar-track{background:transparent}*::-webkit-scrollbar-thumb{background:#333;border-radius:4px}*::-webkit-scrollbar-thumb:hover{background:#555}

        /* Typography */
        .markdown-body { max-width: 100%; min-width: 0; overflow-wrap: break-word; font-size: 0.98rem; line-height: 1.74; color: var(--dai-soft); letter-spacing: 0; }
        .markdown-body > *:first-child { margin-top: 0; }
        .markdown-body > *:last-child { margin-bottom: 0; }
        .markdown-body p { margin: 0 0 1.05rem; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { color: var(--dai-text); font-weight: 720; letter-spacing: 0; line-height: 1.22; text-wrap: balance; }
        .markdown-body h1 { font-size: 1.52rem; margin: 1.8rem 0 0.78rem; }
        .markdown-body h2 { font-size: 1.23rem; margin: 1.55rem 0 0.68rem; padding-top: 0.1rem; }
        .markdown-body h2::before { content: ''; display: inline-block; width: 0.55rem; height: 0.55rem; margin-right: 0.52rem; border-radius: 2px; background: linear-gradient(135deg, var(--dai-accent), var(--dai-accent-2)); vertical-align: 0.06rem; }
        .markdown-body h3 { font-size: 1.08rem; margin: 1.25rem 0 0.55rem; color: #eef2f7; }
        .markdown-body h4 { font-size: 0.96rem; margin: 1rem 0 0.45rem; color: #cbd5e1; }
        .markdown-body a { color: #7dd3fc; text-decoration: none; border-bottom: 1px solid rgba(125,211,252,0.28); transition: border-color 0.2s, color 0.2s; }
        .markdown-body a:hover { color: #bae6fd; border-bottom-color: rgba(186,230,253,0.65); }
        .markdown-body strong { color: #fff7ed; font-weight: 700; }
        .markdown-body ul, .markdown-body ol { margin: 0.7rem 0 1.05rem 1.15rem; padding-left: 0.85rem; }
        .markdown-body li { margin: 0.38rem 0; padding-left: 0.2rem; }
        .markdown-body li > p { margin-bottom: 0.45rem; }
        .markdown-body ul li::marker { color: #f59e0b; }
        .markdown-body ol li::marker { color: #38bdf8; font-weight: 700; }
        .markdown-body hr { border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 1.6rem 0; }
        .markdown-body blockquote { margin: 1.1rem 0; padding: 0.85rem 1rem; border-left: 3px solid var(--dai-accent-2); background: rgba(245,158,11,0.08); color: #e5e7eb; border-radius: 0 8px 8px 0; }
        .table-scroll { width: 100%; max-width: 100%; overflow-x: auto; margin: 1.15rem 0 1.35rem; border: 1px solid var(--dai-border); border-radius: 8px; background: rgba(255,255,255,0.025); position: relative; }
        .table-tools { position: sticky; left: 0; top: 0; z-index: 3; display: flex; justify-content: flex-end; padding: 0.45rem 0.5rem 0; pointer-events: none; }
        .table-tools .code-action { pointer-events: auto; background: rgba(15,15,15,0.82); }
        .markdown-body table { width: 100%; min-width: max-content; border-collapse: separate; border-spacing: 0; font-size: 0.91rem; }
        .markdown-body th, .markdown-body td { padding: 0.68rem 0.82rem; border-bottom: 1px solid rgba(255,255,255,0.09); text-align: left; vertical-align: top; }
        .markdown-body td { color: #d1d5db; }
        .markdown-body th { color: #f8fafc; background: rgba(255,255,255,0.055); font-weight: 700; position: sticky; top: 0; z-index: 1; }
        .markdown-body td[data-numeric="true"], .markdown-body th[data-numeric="true"] { text-align: right; font-variant-numeric: tabular-nums; }
        .markdown-body tbody tr:hover td { background: rgba(255,255,255,0.025); }
        .markdown-body tr:last-child td { border-bottom: none; }
        .markdown-body .math-block { width: 100%; max-width: 100%; overflow-x: auto; overflow-y: hidden; overscroll-behavior-inline: contain; -webkit-overflow-scrolling: touch; margin: 1rem 0 1.25rem; padding: 0.72rem 0.85rem; border-radius: 14px; background: rgba(56,189,248,0.045); border: 1px solid rgba(56,189,248,0.14); }
        .markdown-body .math-block .katex-display { margin: 0; min-width: max-content; }
        .markdown-body .katex-display { display: block; width: 100%; max-width: 100%; overflow-x: auto; overflow-y: hidden; overscroll-behavior-inline: contain; -webkit-overflow-scrolling: touch; padding: 0.45rem 0; }
        .markdown-body .katex-display > .katex { display: inline-block; min-width: max-content; }
        .markdown-body .katex { max-width: 100%; }
        .markdown-body p > .katex { display: inline-block; overflow-x: auto; overflow-y: hidden; overscroll-behavior-inline: contain; -webkit-overflow-scrolling: touch; vertical-align: middle; }
        .markdown-body :not(pre) > code { font-family: 'JetBrains Mono', monospace; background: rgba(125,211,252,0.08); color: #bae6fd; padding: 0.16em 0.38em; border-radius: 4px; font-size: 0.86em; border: 1px solid rgba(125,211,252,0.14); }
        .markdown-body pre { margin: 0; padding: 0; background: transparent; border-radius: 0; border: 0; overflow: visible; }
        .markdown-body pre code { background: #0b0b0b; padding: 1rem; color: inherit; display: block; width: max-content; min-width: 100%; overflow: visible; border: none; }
        .code-box { position: relative; max-width: 100%; max-height: 640px; margin: 1.25rem 0; background: #0b0b0b; border: 1px solid var(--dai-border); border-radius: 8px; overflow: hidden; }
        .code-head { position: sticky; top: 0; left: 0; z-index: 4; display: flex; justify-content: space-between; align-items: center; width: 100%; min-width: 100%; background: linear-gradient(to bottom, rgba(18,18,18,0.98) 0%, rgba(18,18,18,0.94) 100%); padding: 0.55rem 0.65rem 0.55rem 0.9rem; font-size: 0.72rem; color: #a1a1aa; font-family: 'Inter', sans-serif; font-weight: 740; text-transform: uppercase; letter-spacing: 0.04em; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .code-actions { display: inline-flex; align-items: center; gap: 0.35rem; }
        .code-action { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; color: #9ca3af; border: 1px solid transparent; transition: color 0.2s, border-color 0.2s, background 0.2s; }
        .code-action:hover { color: #f8fafc; border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); }
        .code-box.collapsed { max-height: 290px; }
        .code-box.collapsed .code-body { max-height: 220px; overflow: hidden; position: relative; }
        .code-box.collapsed .code-body::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: linear-gradient(to bottom, transparent, #0d0d0d); pointer-events: none; }
        .code-body { padding: 0; overflow: auto; }
        .code-box.code-wrap pre code { width: auto; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
        .code-preview-panel { border-top: 1px solid rgba(255,255,255,0.1); background: #0f0f0f; padding: 0.75rem; }
        .sandbox-frame { width: 100%; min-height: 280px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; background: white; }
        .dai-widget { position: relative; margin: 1.2rem 0 1.35rem; border: 1px solid rgba(125,211,252,0.18); border-radius: 22px; background: radial-gradient(circle at 16% 0%, rgba(125,211,252,0.16), transparent 34%), radial-gradient(circle at 86% 18%, rgba(245,158,11,0.13), transparent 32%), linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.024)); overflow: hidden; box-shadow: 0 18px 55px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.08); }
        .dai-widget::before { content: ''; position: absolute; inset: -45% -20% auto; height: 170px; background: linear-gradient(90deg, transparent, rgba(125,211,252,0.18), rgba(244,114,182,0.13), transparent); filter: blur(18px); animation: auroraDrift 7s ease-in-out infinite; pointer-events: none; }
        .dai-widget-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.86rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.08); color: var(--dai-text); font-weight: 760; font-size: 0.86rem; }
        .dai-widget-kicker { color: #bae6fd; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.11em; padding: 0.26rem 0.52rem; border-radius: 999px; background: rgba(56,189,248,0.1); border: 1px solid rgba(125,211,252,0.16); }
        .dai-widget-body { position: relative; padding: 1rem; }
        .dai-widget-note { color: var(--dai-muted); font-size: 0.84rem; line-height: 1.55; }
        .dai-chart-shell { position: relative; width: 100%; min-height: 360px; padding: 0.75rem; border-radius: 18px; background: linear-gradient(180deg, rgba(2,6,23,0.42), rgba(2,6,23,0.2)); border: 1px solid rgba(255,255,255,0.07); }
        .dai-chart-shell canvas { width: 100% !important; height: 340px !important; }
        .dai-chart-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem; margin-bottom: 0.85rem; }
        .dai-chart-stat { padding: 0.65rem 0.72rem; border-radius: 14px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.07); }
        .dai-chart-stat span { display: block; color: var(--dai-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; }
        .dai-chart-stat strong { display: block; color: var(--dai-text); font-size: 1rem; line-height: 1.25; margin-top: 0.2rem; font-variant-numeric: tabular-nums; }
        .dai-sandbox-title { color: var(--dai-muted); font-size: 0.78rem; margin-bottom: 0.65rem; }
        .pythagoras-grid { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 1rem; align-items: center; }
        .pythagoras-viz { width: 100%; min-height: 230px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; background: rgba(0,0,0,0.22); }
        .pythagoras-controls { display: flex; flex-direction: column; gap: 0.85rem; }
        .dai-range-row { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr) 3.5rem; gap: 0.55rem; align-items: center; color: var(--dai-muted); font-size: 0.82rem; }
        .dai-range-row input { accent-color: var(--dai-accent); width: 100%; }
        .pythagoras-result { border: 1px solid rgba(56,189,248,0.16); border-radius: 8px; padding: 0.75rem; background: rgba(56,189,248,0.06); font-variant-numeric: tabular-nums; }
        .pythagoras-result strong { display: block; color: var(--dai-text); font-size: 1.35rem; line-height: 1.1; }
        @media (max-width: 720px) {
            .pythagoras-grid { grid-template-columns: 1fr; }
            .dai-widget-body { padding: 0.75rem; }
        }

        .attachment-card { display: inline-flex; align-items: center; gap: 0.75rem; max-width: 100%; min-height: 72px; padding: 0.55rem 0.7rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; background: rgba(255,255,255,0.04); }
        .attachment-thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,0.12); background: #080808; flex: 0 0 auto; }
        .attachment-icon { width: 42px; height: 42px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #f8fafc; background: linear-gradient(135deg, rgba(45,212,191,0.18), rgba(244,63,94,0.12)); border: 1px solid rgba(255,255,255,0.1); flex: 0 0 auto; }
        .attachment-meta { min-width: 0; display: flex; flex-direction: column; gap: 0.18rem; }
        .attachment-name { max-width: min(360px, 58vw); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #f8fafc; font-size: 0.85rem; font-weight: 600; letter-spacing: 0; }
        .attachment-detail { color: #9ca3af; font-size: 0.72rem; }
        .attachment-remove { width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #fca5a5; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.18); flex: 0 0 auto; }
        .attachment-remove:hover { color: #fff; background: rgba(239,68,68,0.9); }

        /* --- Message Animation --- */
        .msg-appear { animation: slideUpFade 0.2s cubic-bezier(0.2, 0.9, 0.4, 1) forwards; opacity: 0; transform: translateY(10px); }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* --- Image Generation UI & Fluid Animation --- */
        .dai-img-container { position: relative; overflow: hidden; border-radius: 20px; margin: 1rem 0; border: 1px solid #333; background: #080808; display: inline-block; width: 100%; max-width: 100%; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }

        .dai-img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.7s ease, filter 0.7s ease; position: relative; z-index: 10; filter: blur(24px); }
        .dai-img.loaded { opacity: 1; filter: blur(0); }

        /* --- Video Generation UI & Fluid Animation --- */
        .dai-video-container { position: relative; overflow: hidden; border-radius: 20px; margin: 1rem 0; border: 1px solid #333; background: #080808; display: inline-block; width: 100%; max-width: 100%; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }

        .dai-video { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.7s ease, filter 0.7s ease; position: relative; z-index: 10; filter: blur(24px); }
        .dai-video.loaded { opacity: 1; filter: blur(0); }

        /* --- Music Generation UI --- */
        .dai-audio-container { position: relative; overflow: hidden; border-radius: 20px; margin: 1rem 0; border: 1px solid #333; background: #080808; display: inline-block; width: 100%; max-width: 100%; min-height: 160px; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
        .dai-audio-shell { position: relative; z-index: 10; display: flex; flex-direction: column; gap: 10px; justify-content: center; min-height: 160px; padding: 18px; background: radial-gradient(circle at top left, rgba(59,130,246,0.16), rgba(0,0,0,0.6)); }
        .dai-audio { width: 100%; }

        .dai-watermark { position: absolute; bottom: 12px; right: 12px; font-size: clamp(16px, 3.5vw, 28px); font-weight: 800; color: rgba(255, 255, 255, 0.9); text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8); z-index: 15; pointer-events: none; font-family: 'Inter', sans-serif; }

        .dai-overlay { position: absolute; top: 12px; right: 12px; opacity: 0; transition: opacity 0.2s; display: flex; gap: 8px; z-index: 20; pointer-events: none; }
        .dai-img-container:hover .dai-overlay { opacity: 1; pointer-events: auto; }
        .dai-video-container:hover .dai-overlay { opacity: 1; pointer-events: auto; }
        .dai-audio-container:hover .dai-overlay { opacity: 1; pointer-events: auto; }
        .dai-overlay.visible { display: flex; opacity: 1; pointer-events: auto; }

        .dai-btn { background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.15); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; backdrop-filter: blur(4px); }
        .dai-btn:hover { background: #3b82f6; border-color: #3b82f6; transform: scale(1.05); box-shadow: 0 2px 8px rgba(59,130,246,0.3); }

        /* Fluid Animation Specifics */
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .blob { position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.6; animation: float 3s ease-in-out infinite alternate; will-change: transform; }

        .fluid-container { position: absolute; inset: 0; transition: opacity 1000ms; opacity: 0; z-index: 5; background: #000; }
        .fluid-container.active { opacity: 1; }

        .progress-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; transition: opacity 300ms; opacity: 0; }
        .progress-svg.active { opacity: 1; }

        .progress-rect { mix-blend-mode: screen; transition: stroke-opacity 0.3s; }

        .gen-status { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; z-index: 35; text-shadow: 0 2px 4px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.3s; }
        .gen-status.active { opacity: 0.7; }

        /* Vision analysis handoff */
        header::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            background:
                linear-gradient(110deg, rgba(37,99,235,0.18), rgba(20,184,166,0.12), rgba(244,63,94,0.14), rgba(37,99,235,0.18));
            background-size: 260% 260%;
            filter: blur(10px);
            transition: opacity 0.4s ease;
            animation: analysingGradient 5s ease-in-out infinite;
        }

        header.analysing-glow::before { opacity: 1; }
        header > * { position: relative; z-index: 1; }

        .status-flow { position: relative; display: inline-flex; align-items: center; max-width: 100%; min-height: 58px; padding: 0.75rem 0.9rem; overflow: visible; isolation: isolate; border-radius: 999px; background: transparent; }
        .status-flow::before { content: ''; position: absolute; inset: -28px -36px; border-radius: 999px; background: radial-gradient(circle at 22% 45%, rgba(125,211,252,0.46), transparent 33%), radial-gradient(circle at 62% 38%, rgba(167,139,250,0.35), transparent 32%), radial-gradient(circle at 84% 65%, rgba(245,158,11,0.28), transparent 30%); filter: blur(24px); animation: loadingBlob 2.9s ease-in-out infinite; z-index: -1; pointer-events: none; }
        .status-flow::after { content: ''; position: absolute; top: 50%; left: -42px; width: 46px; height: 46px; border-radius: 999px; transform: translateY(-50%); background: rgba(255,255,255,0.18); filter: blur(16px); animation: hoverSpot 2.6s ease-in-out infinite; z-index: 2; pointer-events: none; }
        .status-copy { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 0.12rem; color: rgba(255,255,255,0.94); text-shadow: 0 1px 18px rgba(125,211,252,0.24); }
        .status-label { font-size: 0.74rem; font-weight: 760; letter-spacing: 0.12em; text-transform: uppercase; }
        .status-detail { font-size: 0.78rem; color: rgba(209,213,219,0.78); letter-spacing: 0; }
        .thinking-fade { opacity: 0.34; filter: blur(0.4px); transition: opacity 0.3s ease, filter 0.3s ease; }
        @keyframes gradientSlide { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes hoverSpot { 0% { left: -44px; opacity: 0; } 16% { opacity: 0.95; } 78% { opacity: 0.95; } 100% { left: calc(100% + 8px); opacity: 0; } }

        @keyframes analysingGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }


        /* Aura answer surfaces */
        @keyframes auroraDrift { 0%, 100% { transform: translate3d(-4%, -3%, 0) scale(1) rotate(0deg); opacity: 0.86; } 50% { transform: translate3d(5%, 4%, 0) scale(1.08) rotate(1deg); opacity: 1; } }
        @keyframes auraBloom { 0% { opacity: 0; transform: translateY(8px) scale(0.985); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes textUnveil { 0% { opacity: 0; filter: blur(18px); transform: translateY(3px); } 100% { opacity: 1; filter: blur(0); transform: translateY(0); } }
        @keyframes auraFade { to { opacity: 0; transform: scale(1.04); } }
        @keyframes loadingBlob { 0%, 100% { transform: translate3d(-3%, 0, 0) scale(0.92, 1.04) rotate(0deg); } 50% { transform: translate3d(4%, -2%, 0) scale(1.08, 0.94) rotate(4deg); } }
        .assistant-shell { position: relative; width: 100%; min-width: 0; padding: clamp(1rem, 2.4vw, 1.35rem); border: 0; border-radius: 28px; background: transparent; box-shadow: none; overflow: visible; isolation: isolate; animation: auraBloom 0.5s cubic-bezier(.2,.8,.2,1) both; }

    <script>
        const hashCode = s => s.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
        const stableId = (prefix, value) => `${prefix}-${Math.abs(hashCode(String(value || prefix))).toString(36)}`;
        window.daiWidgetPayloads = new Map();

        const buildSandboxSrcdoc = ({ html = '', css = '', js = '', title = 'Preview' }) => {
            const safeHtml = String(html || '').slice(0, 18000);
            const safeCss = String(css || '').slice(0, 10000);
            const safeJs = String(js || '').slice(0, 10000);
            return `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src data:; form-action 'none'; base-uri 'none';">
<title>${String(title || 'Preview').replace(/[<>&"]/g, '')}</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#111827}
body{padding:18px;box-sizing:border-box}
*{box-sizing:border-box}
${safeCss}
</style>
</head>
<body>
${safeHtml}
<script>
try {
${safeJs}
} catch (error) {
  document.body.insertAdjacentHTML('beforeend', '<pre style="margin-top:16px;padding:12px;border-radius:8px;background:#fee2e2;color:#991b1b;white-space:pre-wrap;font:12px ui-monospace,monospace;"></pre>');
  document.body.lastElementChild.textContent = error && error.message ? error.message : String(error);
}
<\/script>
</body>
</html>`;
        };

        const createSandboxFrame = (payload) => {
            const iframe = document.createElement('iframe');
            iframe.className = 'sandbox-frame';
            iframe.setAttribute('sandbox', 'allow-scripts');
            iframe.setAttribute('loading', 'lazy');
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            iframe.title = payload.title || 'Dai preview';
            iframe.style.minHeight = `${Math.min(Math.max(Number(payload.height) || 300, 180), 720)}px`;
            iframe.srcdoc = buildSandboxSrcdoc(payload);
            return iframe;
        };

        window.copyCodeBlock = (btn) => {
            const box = btn.closest('.code-box');
            const code = box?.querySelector('code')?.innerText || '';
            navigator.clipboard.writeText(code);
        };

        window.toggleCodeBlock = (btn) => {
            const box = btn.closest('.code-box');
            box?.classList.toggle('collapsed');
            const icon = btn.querySelector('i');
            if (icon) icon.className = box?.classList.contains('collapsed') ? 'fa-solid fa-up-right-and-down-left-from-center' : 'fa-solid fa-down-left-and-up-right-to-center';
        };

        window.toggleCodeWrap = (btn) => {
            const box = btn.closest('.code-box');
            box?.classList.toggle('code-wrap');
            const icon = btn.querySelector('i');
            if (icon) icon.className = box?.classList.contains('code-wrap') ? 'fa-solid fa-align-left' : 'fa-solid fa-arrow-right-arrow-left';
        };

        window.toggleCodePreview = (btn) => {
            const box = btn.closest('.code-box');
            if (!box) return;
            const existing = box.querySelector('.code-preview-panel');
            if (existing) {
                existing.remove();
                return;
            }
            const code = box.querySelector('code')?.innerText || '';
            const panel = document.createElement('div');
            panel.className = 'code-preview-panel';
            panel.appendChild(createSandboxFrame({ html: code, title: 'HTML preview', height: 340 }));
            box.appendChild(panel);
            box.classList.remove('collapsed');
        };

        const copyTable = (btn) => {
            const table = btn.closest('.table-scroll')?.querySelector('table');
            if (!table) return;
            const text = [...table.querySelectorAll('tr')].map(row =>
                [...row.children].map(cell => cell.innerText.trim()).join('\t')
            ).join('\n');
            navigator.clipboard.writeText(text);
        };

        document.addEventListener('click', (event) => {
            const codeBtn = event.target.closest('[data-code-action]');
            if (codeBtn) {
                const action = codeBtn.getAttribute('data-code-action');
                if (action === 'copy') window.copyCodeBlock(codeBtn);
                if (action === 'toggle') window.toggleCodeBlock(codeBtn);
                if (action === 'wrap') window.toggleCodeWrap(codeBtn);
                if (action === 'preview') window.toggleCodePreview(codeBtn);
                return;
            }

            const tableBtn = event.target.closest('[data-table-action="copy"]');
            if (tableBtn) {
                copyTable(tableBtn);
                return;
            }

            const mediaBtn = event.target.closest('[data-dai-action]');
            if (mediaBtn) {
                const action = mediaBtn.getAttribute('data-dai-action');
                if (action === 'download-image') window.dlImg(mediaBtn.id, mediaBtn.getAttribute('data-filename') || '');
                if (action === 'download-video') window.dlVideo(mediaBtn.id, mediaBtn.getAttribute('data-filename') || '');
                if (action === 'download-audio') window.dlAudio(mediaBtn.id, mediaBtn.getAttribute('data-filename') || '');
            }
        });

        // --- ERROR MESSAGES ---
        const busyReasons = [
            "The answer path is taking longer than usual.",
            "The model queue is briefly backed up.",
            "A retry is warming up in the background.",
            "The response stream stalled for a moment.",
            "The compute lane is temporarily busy.",
            "The request is being re-routed cleanly."
        ];

        // --- ERROR LOADER FUNCTION ---
        window.showErrorLoader = (container, retryCallback) => {
            const randomReason = busyReasons[Math.floor(Math.random() * busyReasons.length)];
            let countdown = 10;
            let intervalId;

            const html = `
                <div class="error-loader-container">

            const sourceUrl = URL.createObjectURL(file);

                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = () => reject(new Error('Unable to read the selected image.'));
                });

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const targetBytes = 2.5 * 1024 * 1024;
                let maxSide = 1600;
                let quality = 0.82;
                let dataUrl = '';

                for (let attempt = 0; attempt < 8; attempt++) {
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const width = Math.max(1, Math.round(img.width * scale));
                    const height = Math.max(1, Math.round(img.height * scale));

                    canvas.width = width;
                    canvas.height = height;
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);

                    dataUrl = canvas.toDataURL('image/jpeg', quality);
                    const approxBytes = Math.ceil((dataUrl.length - 'data:image/jpeg;base64,'.length) * 0.75);

                    if (approxBytes <= targetBytes) break;
                    if (quality > 0.58) quality -= 0.08;

        // --- Core: Image Watermarker ---
        async function processAndWatermark(blob) {
            if (!blob || !blob.type || !blob.type.startsWith('image/')) {
                throw new Error(`Invalid image payload received (${blob?.type || 'unknown type'})`);
            }

            const img = new Image();
            img.src = URL.createObjectURL(blob);
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = () => reject(new Error('Failed to decode generated image payload'));
            });

            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(img, 0, 0);

            const fontSize = Math.max(24, img.width * 0.035);
            ctx.font = `800 ${fontSize}px 'Inter', sans-serif`;
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            const margin = fontSize * 0.8;
            ctx.fillText("D'Ai", img.width - margin, img.height - margin);

            URL.revokeObjectURL(img.src);

            return new Promise((resolve, reject) => {
                canvas.toBlob(b => {
                    if (!b) {
                        reject(new Error('Failed to encode watermarked image'));
                        return;
                    }
                    resolve(URL.createObjectURL(b));
                }, 'image/jpeg', 0.95);
            });
        }

                if(!wrapper) return;

                const colors = ['#475569', '#64748b', '#94a3b8', '#1e293b'];
                for (let i = 0; i < 12; i++) {
                    const b = document.createElement('div');
                    b.className = 'blob';
                    const left = Math.random() * 110 - 5;
                    const top = Math.random() * 110 - 5;
                    const color = colors[i % 4];

                    b.style.left = `${left}%`;

                    b.style.backgroundColor = color;
                    b.style.width = `270px`;

                    b.style.animationDuration = `3.2s`;

            run: (containerId, from, to, duration, onDone) => {
                const rect = document.querySelector(`#${containerId} .progress-rect`);

                // Cancel previous animation if any to prevent glitching

                    const elapsed = now - startTimestamp;
                    const dt = Math.min(elapsed / duration, 1);
                    const val = from + (to - from) * dt;

                    rect.setAttribute('stroke-dashoffset', 100 - val);
                    rect.style.strokeOpacity = val <= 0 ? '0' : '0.8';

                    if (dt < 1) {
                        FluidAnim.rafs[containerId] = requestAnimationFrame(loop);
                    } else {
                        delete FluidAnim.rafs[containerId];
                        if (onDone) onDone();
                    }
                }
                FluidAnim.rafs[containerId] = requestAnimationFrame(loop);
            }
        };

                            { role: 'user', content: message }
                        ]
                    })
                });
                if (!res.ok) throw new Error(`explain failed ${res.status}`);
                const text = await res.text();
                let answer = '';
                try {
                    const payload = JSON.parse(text);
                    answer = payload.choices?.[0]?.message?.content || payload.choices?.[0]?.delta?.content || '';
                } catch (e) {
                    answer = text.split('\n').map((line) => {

            const urlKey = `${prompt}-${width}-${height}-${seed}-${sourceImage ? 'edit' : 'new'}-watermarked`;

            }

            // Initialize Animation
            FluidAnim.init(containerId);

                if (sourceImage) body.image = sourceImage;

                console.log('[fetchServerImage] Sending to /api/image:', body);

                let res;
                let lastImageError;
                for (let attempt = 1; attempt <= 2; attempt++) {
                    res = await fetch('/api/image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    console.log('[fetchServerImage] Response status:', res.status, res.statusText, 'attempt', attempt);
                    console.log('[fetchServerImage] Response headers:', Object.fromEntries(res.headers.entries()));

                    if (res.ok) break;
                    let detail = res.statusText;

                    if (detail.includes("400") || detail.includes("Bad Request") || detail.includes("unsafe")) {
                        lastImageError = new Error("Generation Failed: Prompt flagged as unsafe or invalid request.");
                        break;

                const rawBlob = await res.blob();
                console.log('[fetchServerImage] Received blob:', { size: rawBlob.size, type: rawBlob.type });
                const watermarkedUrl = await processAndWatermark(rawBlob);
                console.log('[fetchServerImage] Watermarked URL created:', watermarkedUrl);

                window.pCache.set(urlKey, watermarkedUrl);

                console.log('[fetchServerImage] Calling finishAnimation with URL');

                progSvg.classList.remove('active');

            function finishAnimation(finalUrl) {
                // Phase 3: Snap from whatever progress to 100% fast (500ms)
                // We calculate current progress based on visual state or just force 95->100
                FluidAnim.run(containerId, 95, 100, 500, () => {
                    // Hide Animation Layers
                    fluidCont.classList.remove('active');

                        imgEl.classList.add('loaded');

            const sourceImage = encSourceImage ? decodeURIComponent(encSourceImage) : null;
            const urlKey = `${prompt}-${width}-${height}-${duration}-${sourceImage ? 'edit' : 'new'}-video`;

            // UI Elements

            // Validate all required elements exist

                console.error('Required animation elements not found in container:', containerId);
                return;
            }

            // Initialize Animation
            FluidAnim.init(containerId);
            fluidCont.classList.add('active');
            progSvg.classList.add('active');
            genStatus.classList.add('active');

            // Phase 1: 0 -> 85% in 8s (Longer animation for video generation)
            FluidAnim.run(containerId, 0, 85, 8000, () => {
                // Phase 2: Creep to 99% if still loading
                if (!videoEl.classList.contains('loaded') && !videoEl.classList.contains('error')) {
                    FluidAnim.run(containerId, 85, 99, 24000);
                }
            });

            if(window.vCache && window.vCache.has(urlKey)) {
                // Cache hit fast path
                videoEl.src = window.vCache.get(urlKey);
                setTimeout(() => finishAnimation(videoEl.src), 100);
                return;
            }

            try {
                const body = {
                    prompt,
                    width,
                    height,
                    duration: parseInt(duration) || 4,
                    aspectRatio: aspectRatio || '16:9',
                    model: 'ltx-2'
                };

                if (sourceImage) {
                    body.image = sourceImage;
                }

                let videoUrl;
                let lastVideoError;
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        const res = await fetch('/api/video', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });

                        if (!res.ok) {
                            let detail = res.statusText;
                            try { const j = await res.json(); if(j.error) detail = j.error; } catch(e){}
                            if (detail.includes("400") || detail.includes("Bad Request") || detail.includes("unsafe")) {
                                throw new Error("Generation Failed: Prompt flagged as unsafe or invalid request.");
                            }
                            throw detail.includes("429") || detail.includes("Resource exhausted")
                                ? new Error("High Traffic: Video API is overloaded. Please wait a moment.")
                                : new Error(`Server Error (${res.status}): ${detail}`);
                        }

                        const { url, apiKey } = await res.json();
                        if (!url || !apiKey) throw new Error("Server Error: Missing video URL or API key");

                        const videoRes = await fetch(url, {
                            method: 'GET',
                            headers: {
                                'Authorization': `Bearer ${apiKey}`,
                                'Accept': 'video/mp4,video/*'
                            }
                        });

                        if (!videoRes.ok) {
                            let detail = videoRes.statusText;
                            try {
                                const j = await videoRes.json();
                                if (j.error) detail = typeof j.error === 'object' ? j.error.message : j.error;
                            } catch(e) {}
                            throw new Error(`Pollinations API Error (${videoRes.status}): ${detail}`);
                        }

                        const videoBlob = await videoRes.blob();
                        videoUrl = URL.createObjectURL(videoBlob);
                        break;
                    } catch (attemptError) {
                        lastVideoError = attemptError;
                        console.warn('[fetchServerVideo] Attempt failed:', attempt, attemptError);
                        if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 1200));
                    }
                }

                if (!videoUrl) throw lastVideoError || new Error('Video generation failed after retry.');

                if(!window.vCache) window.vCache = new Map();
                window.vCache.set(urlKey, videoUrl);

                finishAnimation(videoUrl);

                progSvg.classList.remove('active');
                genStatus.classList.remove('active');

                                if (!res.ok) throw new Error(`API Error: ${res.status}`);

                                const reader = res.body.getReader();
                                const dec = new TextDecoder();
                                let fullText = "";
                                let buffer = "";
                                getMd();

                                while (true) {
                                    const {done, value} = await reader.read();

                                    buffer += dec.decode(value, {stream: true});

                                    for (const line of lines) {
                                        if (line.startsWith('data: ')) {
                                            try {
                                                const jsonStr = line.slice(6).trim();

                                                const json = JSON.parse(jsonStr);
                                                const delta = json.choices[0]?.delta?.content || "";

                                                if (delta) {
                                                    fullText += delta;
                                                    renderAssistantContent(fullText, el);
                                                }
                                            } catch (e) {}
                                        }
                                    }
                                }

                                renderAssistantContent(fullText, el, { final: true });
                                S.msg.push({role:"user",content:userContent});
                                S.msg.push({role:"assistant",content:fullText});
                                saveSyncedMessage('assistant', fullText, { mode: 'retry' });

                            } catch(retryError) {
                                // If retry also fails, show a simpler error message
                                el.innerHTML = `<div class="text-red-500 text-xs mt-2 p-3 bg-red-500/10 border border-red-500/20 rounded-lg"><strong>⚠️ Connection Error:</strong> D'Ai is having trouble connecting. Please check your connection and try again.</div>`;
                            } finally {
                                S.gen=false;
                                document.getElementById('btn').disabled=false;
                                document.getElementById('btn').textContent = '➜';
                            }
                        }, 500); // Small delay before retry
                    });

                    // Keep button disabled during error/retry phase
                    // Will be re-enabled after retry completes
                }
            };
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/dverseClient.js"></script>
</body>
</html>
